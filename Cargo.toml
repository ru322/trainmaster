[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release-check]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
