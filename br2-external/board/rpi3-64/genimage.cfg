image boot.vfat {
	vfat {
		files = {
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb",
			"bcm2710-rpi-cm3.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"Image"
		}
	}

	size = 64M
}

image boot-exhibit.vfat {
	vfat {
		files = {
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb",
			"bcm2710-rpi-cm3.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"Image"
		}

		file cmdline.txt {
			image = "rpi-firmware/cmdline-exhibit.txt"
		}
	}

	size = 64M
}

image data.ext4 {
	ext4 {
		label = "TMDATA"
		use-mke2fs = true
		extraargs = "-b 4096"
	}

	empty = true
	size = 64M
}

image sdcard.img {
	hdimage {
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}

image sdcard-exhibit.img {
	hdimage {
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot-exhibit.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
