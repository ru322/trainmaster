[package]
name = "tm-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
tm-numeric = { path = "../tm-numeric" }
tm-pathfind = { path = "../tm-pathfind" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
toml = "1"
rand_chacha = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1"
criterion = "0.8"

[[bench]]
name = "tick"
harness = false

[[bench]]
name = "snapshot"
harness = false
